name: OakLarder
options:
  bundleIdPrefix: com.oaklarder
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
packages:
  Alamofire:
    url: https://github.com/wrandecima-bit/Alamofire
    branch: master
  SnapKit:
    url: https://github.com/SnapKit/SnapKit.git
    from: "5.7.1"
  AppsFlyer:
    url: https://github.com/AppsFlyerSDK/AppsFlyerFramework-Static
    from: "6.17.9"
targets:
  OakLarder:
    type: application
    platform: iOS
    sources:
      - path: OakLarder
    dependencies:
      - sdk: libsqlite3.tbd
      - package: Alamofire
      - package: SnapKit
      - package: AppsFlyer
        product: AppsFlyerLib-Static
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oaklarder.pantry
        PRODUCT_NAME: OakLarder
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: OakLarder/Resources/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: OakLarder
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        INFOPLIST_KEY_NSCameraUsageDescription: OakLarder uses the camera only to stamp grocery barcodes onto your oak pantry board.
        INFOPLIST_KEY_NSUserTrackingUsageDescription: We use this identifier to personalize your experience and measure app performance.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        SWIFT_STRICT_CONCURRENCY: complete
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        ENABLE_TESTABILITY: YES
    scheme:
      testTargets:
        - OakLarderTests
  OakLarderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OakLarderTests
    dependencies:
      - target: OakLarder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oaklarder.pantry.tests
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_VERSION: "6.2"
        SWIFT_STRICT_CONCURRENCY: complete
